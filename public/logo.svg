<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#EC4899" />
      <stop offset="25%" stopColor="#8B5CF6" />
      <stop offset="50%" stopColor="#00E5FF" />
      <stop offset="75%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Deep Midnight Core -->
    <radialGradient id="innerCoreBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#0E1B38" />
      <stop offset="65%" stopColor="#070C1A" />
      <stop offset="100%" stopColor="#03050C" />
    </radialGradient>

    <!-- Bio Brain Gradient (Left) -->
    <linearGradient id="bioBrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="35%" stopColor="#F97316" />
      <stop offset="70%" stopColor="#EC4899" />
      <stop offset="100%" stopColor="#BE185D" />
    </linearGradient>

    <!-- Tech Circuit Brain Gradient (Right) -->
    <linearGradient id="techBrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="40%" stopColor="#38BDF8" />
      <stop offset="75%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>

    <!-- Center Amber Light Flare -->
    <linearGradient id="centerFlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0" />
      <stop offset="50%" stopColor="#FBBF24" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0" />
    </linearGradient>

    <!-- Text Arcs -->
    <path id="topArcPath" d="M 68,250 A 182,182 0 0,1 432,250" fill="none" />
    <path id="bottomArcPath" d="M 432,252 A 182,182 0 0,1 68,252" fill="none" />
  </defs>

  <!-- Outer Glowing Gradient Border -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#ringGrad)" stroke-width="15" />

  <!-- White Outer Circular Band -->
  <circle cx="250" cy="250" r="234.5" fill="#FFFFFF" stroke="#0A0F1D" stroke-width="2" />

  <!-- Top Curved Text: DEPARTMENT OF CSE(AIML) & AI -->
  <text fill="#070D1E" font-size="20" font-weight="900" letter-spacing="3" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      <tspan fill="#00E5FF" font-size="22">• </tspan>DEPARTMENT OF CSE(AIML) &amp; AI<tspan fill="#00E5FF" font-size="22"> •</tspan>
    </textPath>
  </text>

  <!-- Bottom Curved Text: CODE • INNOVATE • INTELLIGENTLY -->
  <text fill="#070D1E" font-size="17" font-weight="900" letter-spacing="3.5" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      <tspan fill="#00E5FF" font-size="20">• </tspan>CODE<tspan fill="#00E5FF" font-size="20"> • </tspan>INNOVATE<tspan fill="#00E5FF" font-size="20"> • </tspan>INTELLIGENTLY<tspan fill="#00E5FF" font-size="20"> •</tspan>
    </textPath>
  </text>

  <!-- Inner Navy Blue Circle -->
  <circle cx="250" cy="250" r="172" fill="url(#innerCoreBg)" stroke="#070D1E" stroke-width="3" />

  <!-- Inner Cyan Subtle Guideline Ring -->
  <circle cx="250" cy="250" r="169" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />

  <!-- ============================================== -->
  <!-- LEFT FLANKING ICON: LAPTOP WITH CODE </> -->
  <!-- ============================================== -->
  <g transform="translate(92, 232) scale(0.85)" opacity="0.95">
    <!-- Laptop Screen -->
    <rect x="0" y="0" width="36" height="24" rx="3" fill="#0A1124" stroke="#00E5FF" stroke-width="2.5" />
    <text x="18" y="16" fill="#00E5FF" font-size="11" font-weight="900" text-anchor="middle" font-family="'JetBrains Mono', monospace">&lt;/&gt;</text>
    <!-- Laptop Base -->
    <path d="M -6,24 L 42,24 L 38,28 L -2,28 Z" fill="#00E5FF" />
  </g>

  <!-- ============================================== -->
  <!-- RIGHT FLANKING ICON: HEAD WITH NEURAL NETWORK -->
  <!-- ============================================== -->
  <g transform="translate(372, 226) scale(0.85)" opacity="0.95">
    <!-- Head Outline -->
    <path d="M 18,0 C 30,0 36,9 36,20 C 36,29 30,34 26,38 L 26,46 L 10,46 L 10,38 C 4,34 0,27 0,19 C 0,8 8,0 18,0 Z" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Neural Nodes inside Head -->
    <circle cx="14" cy="18" r="3" fill="#F43F5E" />
    <circle cx="24" cy="14" r="3" fill="#00E5FF" />
    <circle cx="19" cy="27" r="3" fill="#10B981" />
    <circle cx="26" cy="24" r="2.5" fill="#A855F7" />
    <line x1="14" y1="18" x2="24" y2="14" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="14" y1="18" x2="19" y2="27" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="24" y1="14" x2="26" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="19" y1="27" x2="26" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- ============================================== -->
  <!-- CENTER GRAPHIC: SPLIT BRAIN & CODE BRACKETS -->
  <!-- ============================================== -->
  <g transform="translate(0, -16)">
    <!-- Amber Central Glow Seam -->
    <rect x="248" y="90" width="4" height="175" fill="url(#centerFlare)" />
    <circle cx="250" cy="175" r="24" fill="#F59E0B" opacity="0.3" filter="blur(10px)" />

    <!-- LEFT HALF: Organic Biological Brain -->
    <g stroke="url(#bioBrainGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer perimeter lobe -->
      <path d="M 238,105 C 205,98 175,114 168,140 C 152,146 148,166 154,184 C 144,196 148,216 163,228 C 173,240 190,245 206,243 C 220,240 231,248 238,252" />
      <!-- Inner sulci / convolutions -->
      <path d="M 192,140 C 208,152 221,142 234,148" />
      <path d="M 174,174 C 190,168 202,182 218,178" />
      <path d="M 184,206 C 198,200 211,212 231,207" />
      <path d="M 198,228 C 210,224 220,232 235,229" />
      <!-- Neural Nodes -->
      <circle cx="192" cy="140" r="4.5" fill="#F97316" stroke="#040711" stroke-width="1.5" />
      <circle cx="234" cy="148" r="4" fill="#FBBF24" stroke="#040711" stroke-width="1.5" />
      <circle cx="174" cy="174" r="4.5" fill="#EC4899" stroke="#040711" stroke-width="1.5" />
      <circle cx="218" cy="178" r="4" fill="#F97316" stroke="#040711" stroke-width="1.5" />
      <circle cx="184" cy="206" r="4.5" fill="#EC4899" stroke="#040711" stroke-width="1.5" />
      <circle cx="231" cy="207" r="4" fill="#F97316" stroke="#040711" stroke-width="1.5" />
    </g>

    <!-- RIGHT HALF: Electronic Circuit Brain -->
    <g stroke="url(#techBrainGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer perimeter cyber trace -->
      <path d="M 262,105 C 295,98 325,114 332,140 C 348,146 352,166 346,184 C 356,196 352,216 337,228 C 327,240 310,245 294,243 C 280,240 269,248 262,252" />
      <!-- Circuit Traces with 45/90 deg angles -->
      <path d="M 265,136 H 298 L 318,148" />
      <path d="M 265,165 H 288 L 306,165 H 328" />
      <path d="M 265,192 H 294 L 312,208 H 332" />
      <path d="M 265,220 H 285 L 301,232" />
      <!-- Circuit Terminal Pads / Solder Nodes -->
      <circle cx="318" cy="148" r="4.5" fill="#00E5FF" stroke="#040711" stroke-width="1.5" />
      <circle cx="328" cy="165" r="4.5" fill="#38BDF8" stroke="#040711" stroke-width="1.5" />
      <circle cx="332" cy="208" r="4.5" fill="#818CF8" stroke="#040711" stroke-width="1.5" />
      <circle cx="301" cy="232" r="4.5" fill="#C084FC" stroke="#040711" stroke-width="1.5" />
    </g>

    <!-- CENTER CODE EMBLEM: </> -->
    <g transform="translate(222, 146)">
      <rect x="0" y="2" width="56" height="54" rx="10" fill="#060A16" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
      <text x="28" y="38" fill="#FFFFFF" font-size="28" font-weight="900" text-anchor="middle" font-family="'JetBrains Mono', monospace">&lt;/&gt;</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- MAIN BRAND TEXT: IntelliGenZ -->
  <!-- ============================================== -->
  <text
    x="250"
    y="308"
    fill="#FFFFFF"
    font-size="46"
    font-weight="900"
    text-anchor="middle"
    font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif"
    letter-spacing="1"
  >
    IntelliGenZ
  </text>

  <!-- ============================================== -->
  <!-- CALLIGRAPHY TEXT: Club with Orange Swoosh -->
  <!-- ============================================== -->
  <text
    x="250"
    y="350"
    fill="#FFFFFF"
    font-size="40"
    font-weight="700"
    text-anchor="middle"
    font-family="'Caveat', cursive, 'Brush Script MT', sans-serif"
  >
    Club
  </text>

  <!-- Orange Swoosh Accent Under Club -->
  <path
    d="M 200,358 Q 250,367 300,358"
    fill="none"
    stroke="#F59E0B"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- ============================================== -->
  <!-- LOWER THREE-ICON TECH STRIP PILL -->
  <!-- ============================================== -->
  <g transform="translate(162, 374)">
    <!-- Container pill -->
    <rect x="0" y="0" width="176" height="34" rx="8" fill="#0A1124" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- 1. AI Microchip (Left) -->
    <g transform="translate(20, 6)">
      <!-- Microchip base -->
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284C7" stroke="#00E5FF" stroke-width="1.2" />
      <text x="11" y="15" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle" font-family="'Outfit', sans-serif">AI</text>
      <!-- Top/Bottom pins -->
      <line x1="5" y1="-3" x2="5" y2="0" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="11" y1="-3" x2="11" y2="0" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="17" y1="-3" x2="17" y2="0" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="5" y1="22" x2="5" y2="25" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="11" y1="22" x2="11" y2="25" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="17" y1="22" x2="17" y2="25" stroke="#00E5FF" stroke-width="1.5" />
    </g>

    <!-- Divider 1 -->
    <line x1="60" y1="5" x2="60" y2="29" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- 2. Robotic Arm (Center) -->
    <g transform="translate(72, 6)">
      <!-- Robot base stand -->
      <rect x="4" y="18" width="16" height="4" rx="1" fill="#00E5FF" />
      <!-- Arm links -->
      <circle cx="12" cy="18" r="3" fill="#F59E0B" />
      <line x1="12" y1="18" x2="20" y2="9" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
      <circle cx="20" cy="9" r="3" fill="#F97316" />
      <line x1="20" y1="9" x2="12" y2="3" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="12" cy="3" r="2.5" fill="#00E5FF" />
    </g>

    <!-- Divider 2 -->
    <line x1="116" y1="5" x2="116" y2="29" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- 3. Cloud Neural Tech (Right) -->
    <g transform="translate(126, 6)">
      <!-- Cloud contour -->
      <path d="M 7,18 A 5,5 0 0,1 9,9 A 7,7 0 0,1 23,9 A 5,5 0 0,1 25,18 Z" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round" />
      <!-- Connected nodes inside cloud -->
      <circle cx="13" cy="14" r="2" fill="#00E5FF" />
      <circle cx="19" cy="12" r="2" fill="#A855F7" />
      <circle cx="16" cy="18" r="2" fill="#F43F5E" />
      <line x1="13" y1="14" x2="19" y2="12" stroke="#00E5FF" stroke-width="1" />
      <line x1="13" y1="14" x2="16" y2="18" stroke="#00E5FF" stroke-width="1" />
      <line x1="19" y1="12" x2="16" y2="18" stroke="#00E5FF" stroke-width="1" />
    </g>
  </g>
</svg>
